<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #dcdbd7; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  a { color: #4a4a46; }
  a:hover { color: #1b1b19; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px;">
  <div style="width: 880px; background: #fbfaf8; border: 1px solid #cfcdc7; border-radius: 12px; box-shadow: 0 18px 48px -18px rgba(30,29,26,0.35); overflow: hidden; color: #1b1b19;">

    <div style="display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid #ecebe7;">
      <div style="font-size: 13px; font-weight: 500; letter-spacing: -0.01em;">내 책상 동료</div>
      <div style="flex: 1;"></div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8b8981; letter-spacing: 0.06em;">ESC</div>
    </div>

    <div style="display: grid; grid-template-columns: 244px 1fr;">

      <div style="padding: 22px 20px; border-right: 1px solid #ecebe7; display: flex; flex-direction: column; gap: 18px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 19px; font-weight: 600; letter-spacing: -0.01em;">{{ charName }}</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8b8981; letter-spacing: 0.04em;">Lv.{{ level }} · {{ job }}</div>
        </div>

        <div style="height: 196px; border: 1px solid #ecebe7; border-radius: 8px; background: #f4f3ef; display: flex; align-items: center; justify-content: center;">
          {{ avatar }}
        </div>

        <div style="font-size: 11px; color: #8b8981;">지금 · 걷는 중</div>

        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8b8981; letter-spacing: 0.08em;"><span>STRESS</span><span>0% · 안정</span></div>
            <div style="height: 4px; border-radius: 2px; background: #eae8e3; overflow: hidden;"><div style="height: 100%; width: 4%; background: #1b1b19;"></div></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8b8981; letter-spacing: 0.08em;"><span>EXP</span><span>193 / 492</span></div>
            <div style="height: 4px; border-radius: 2px; background: #eae8e3; overflow: hidden;"><div style="height: 100%; width: 39%; background: {{ accent }};"></div></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0; border-top: 1px solid #f1f0ec; padding-top: 4px;">
          <sc-for list="{{ stats }}" as="stat" hint-placeholder-count="6">
            <div style="display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f1f0ec; font-size: 12px;">
              <span style="color: #8b8981;">{{ stat.k }}</span>
              <span style="font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em;">{{ stat.v }}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 18px;">

        <div style="display: flex; gap: 22px; border-bottom: 1px solid #ecebe7;">
          <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="3">
            <button onClick="{{ tab.onClick }}" style="appearance: none; background: none; border: none; padding: 0 0 10px; cursor: pointer; font-family: inherit; font-size: 13px; letter-spacing: -0.01em; color: {{ tab.color }}; font-weight: {{ tab.weight }}; border-bottom: 2px solid {{ tab.underline }}; margin-bottom: -1px;">{{ tab.label }}</button>
          </sc-for>
        </div>

        <div style="display: flex; flex-direction: column; gap: 20px;">
          <sc-for list="{{ groups }}" as="group" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; gap: 10px;">

              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 7px; height: 7px; border-radius: 2px; background: {{ group.tint }};"></div>
                <div style="font-size: 12px; font-weight: 600; letter-spacing: -0.01em;">{{ group.label }}</div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #a8a69e; letter-spacing: 0.06em;">{{ group.slot }}</div>
                <div style="flex: 1; height: 1px; background: #f1f0ec;"></div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #a8a69e;">{{ group.count }}</div>
              </div>

              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px;">
                <sc-for list="{{ group.items }}" as="item" hint-placeholder-count="4">
                  <div onClick="{{ item.onClick }}" style="border: 1px solid {{ item.border }}; border-radius: 9px; background: {{ item.bg }}; padding: 11px 11px 10px; display: flex; flex-direction: column; gap: 9px; cursor: {{ item.cursor }}; transition: border-color .12s, transform .12s;" style-hover="border-color: #b9b6ae;">
                    <div style="height: 62px; border-radius: 6px; background: {{ item.thumbBg }}; display: flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1; color: {{ item.glyphColor }};">{{ item.glyph }}</div>
                    <div style="display: flex; flex-direction: column; gap: 3px;">
                      <div style="font-size: 12px; font-weight: 500; letter-spacing: -0.01em; color: {{ item.nameColor }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ item.name }}</div>
                      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.04em; color: {{ item.metaColor }};">{{ item.meta }}</div>
                    </div>
                  </div>
                </sc-for>
              </div>

            </div>
          </sc-for>
        </div>

        <div style="border: 1px solid #ecebe7; border-radius: 9px; padding: 14px 15px; display: flex; flex-direction: column; gap: 8px; background: #f9f8f5;">
          <div style="display: flex; align-items: baseline; gap: 9px;">
            <div style="font-size: 13px; font-weight: 600;">{{ selName }}</div>
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8b8981; letter-spacing: 0.06em;">{{ selMeta }}</div>
            <div style="flex: 1;"></div>
            <button onClick="{{ selAction }}" style="appearance: none; border: 1px solid {{ selBtnBorder }}; background: {{ selBtnBg }}; color: {{ selBtnColor }}; border-radius: 6px; padding: 5px 13px; font-family: inherit; font-size: 11.5px; cursor: {{ selBtnCursor }};">{{ selBtnLabel }}</button>
          </div>
          <div style="font-size: 12px; line-height: 1.6; color: #56544e;">{{ selDesc }}</div>
        </div>

      </div>
    </div>
  </div>
</div>

</x-dc>

  catalog() {
    const lv = this.props.level ?? 4;
    const mk = (cat, slot, tint, items) => ({
      label: cat, slot, tint,
      items: items.map(it => ({ ...it, cat, locked: (it.req || 0) > lv }))
    });
    return [
      mk('모자', 'HEAD', '#c4622d', [
        { name: '천 모자', glyph: '◠', desc: '장식 없는 천 모자. 챙은 항상 가는 쪽을 향한다.' },

  bank() {

    const owned = [];
    for (const g of all) for (const it of g.items) if (!it.locked) owned.push({ ...it, tint: g.tint, slot: g.slot });

  find(key) {

    const cats = this.active();
    const sel = this.find(this.state.sel) || cats[0].items[0];
    const selWorn = this.state.worn[sel.cat] === sel.name;

    const avatar = React.createElement('svg', { width: 100, height: 148, viewBox: '0 0 100 148', fill: 'none' },

      this.state.worn['모자'] ? React.createElement('path', { d: 'M31 24 h38 M38 24 q12 -14 24 0', stroke: '#1b1b19', strokeWidth: 3, strokeLinecap: 'round', fill: 'none' }) : null,
      this.state.worn['안경'] ? React.createElement('path', { d: 'M38 34 h24', stroke: '#1b1b19', strokeWidth: 4, strokeLinecap: 'round' }) : null,
      this.state.worn['망토'] ? React.createElement('path', { d: 'M50 60 L78 96 L50 92 Z', fill: accent, opacity: 0.85 }) : null
    );

    return {
      charName: this.props.charName ?? 'zion',
      level: this.props.level ?? 4,
      job: this.props.job ?? '적응 중인 동료',
      accent, avatar,
      tabs: ['장비', '외형', '보관함'].map(t => ({
        label: t,
        color: this.state.tab === t ? '#1b1b19' : '#9b9990',
        weight: this.state.tab === t ? 600 : 400,
        underline: this.state.tab === t ? '#1b1b19' : 'transparent',
        onClick: () => this.setState({ tab: t })
      })),
      groups: cats.map(g => {
        const owned = g.items.filter(i => !i.locked).length;
        return {
          label: g.label, slot: g.slot, tint: g.tint,
          count: owned + ' / ' + g.items.length,
          items: g.items.map(it => {
            const tint = it.tint || g.tint;
            const key = it.cat + '/' + it.name;
            const isSel = this.state.sel === key;
            const worn = this.state.worn[it.cat] === it.name;
            return {
              name: it.locked ? '???' : it.name,
              glyph: it.locked
                ? React.createElement('div', { style: { position: 'relative', width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center' } },
                    React.createElement('div', { style: { opacity: 0.28 } }, this.art(it.name, '#8b8981')),
                    React.createElement('div', { style: { position: 'absolute', right: -4, bottom: -3, background: '#efeeea', borderRadius: 5, padding: '1px 2px', display: 'flex' } }, this.lockIcon('#a8a69e'))
                  )
                : this.art(it.name, worn ? tint : '#3a3833'),
              meta: it.locked ? 'LV.' + it.req : (worn ? '착용 중' : (g.slot === 'ALL' ? it.cat : '보유')),
              border: isSel ? '#1b1b19' : (worn ? '#c9c6be' : '#ecebe7'),
              bg: it.locked ? '#f6f5f2' : '#ffffff',
              thumbBg: it.locked ? '#efeeea' : (worn ? tint + '1a' : '#f6f5f2'),
              glyphColor: it.locked ? '#c2bfb7' : (worn ? tint : '#3a3833'),
              nameColor: it.locked ? '#b3b0a8' : '#1b1b19',
              metaColor: it.locked ? '#b3b0a8' : (worn ? tint : '#a8a69e'),
              cursor: it.locked ? 'not-allowed' : 'pointer',
              onClick: () => this.setState({ sel: key })
            };
          })
        };
      }),
      selName: sel.locked ? '잠긴 장비' : sel.name,
      selMeta: sel.cat + ' · ' + (sel.locked ? 'Lv.' + sel.req + '에 열림' : (selWorn ? '착용 중' : '보유 중')),
      selDesc: sel.locked ? '레벨 ' + sel.req + '이 되면 열립니다. 지금은 실루엣만 보입니다.' : sel.desc,
      selBtnLabel: sel.locked ? '잠김' : (selWorn ? '해제' : '착용'),
      selBtnBorder: sel.locked ? '#e6e4df' : '#1b1b19',
      selBtnBg: sel.locked ? '#f2f1ed' : (selWorn ? '#ffffff' : '#1b1b19'),
      selBtnColor: sel.locked ? '#b3b0a8' : (selWorn ? '#1b1b19' : '#ffffff'),
      selBtnCursor: sel.locked ? 'not-allowed' : 'pointer',
      selAction: () => {
        if (sel.locked) return;
        this.setState(s => ({ worn: { ...s.worn, [sel.cat]: selWorn ? null : sel.name } }));
      },
      stats: [
        { k: '근속', v: '1일차' }, { k: '함께한 시간', v: '2시간 33분' },
        { k: '격파 성공', v: '아직 없음' }, { k: '대결 승리', v: '1승' },
        { k: '활쏘기 명중', v: '4 / 12' }, { k: '넘어진 횟수', v: '5번' }
      ]
    };
  }
}

</script>
</body>
</html>
